name: Deploy via SSH

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Docker Stack to Server
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '__DEFAULT__' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GH_REF: ${{ github.ref_name }}
        run: |
          set -e
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
            chmod 644 ~/.ssh/known_hosts
            HOST_KEY_OPT="yes"
          else
            HOST_KEY_OPT="accept-new"
          fi

          # Pass GH_TOKEN over encrypted SSH stdin (never as a CLI argument visible in remote `ps`).
          {
            printf 'GH_TOKEN=%q\n' "$GH_TOKEN"
            cat << 'REMOTE_SCRIPT'
          DEPLOY_DIR="$1"
          GH_REPO="$2"
          GH_REF="$3"

          if [ "$DEPLOY_DIR" = "__DEFAULT__" ] || [ -z "$DEPLOY_DIR" ]; then
            DEPLOY_DIR="$HOME/TaskFlow"
          fi
          PLAIN_URL="https://github.com/${GH_REPO}.git"
          AUTH_URL="https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git"

          echo "==> [1/4] User: $(whoami) | Target dir: $DEPLOY_DIR"
          mkdir -p "$DEPLOY_DIR"
          cd "$DEPLOY_DIR"

          if [ ! -d .git ]; then
            echo "==> [2/4] Initializing git repository in $DEPLOY_DIR..."
            git init -b "$GH_REF"
            git remote add origin "$PLAIN_URL"
          else
            echo "==> [2/4] Updating existing repository in $DEPLOY_DIR..."
            git remote set-url origin "$PLAIN_URL"
          fi

          git fetch "$AUTH_URL" "$GH_REF"
          git checkout -B "$GH_REF" FETCH_HEAD

          echo "==> [3/4] Checking .env in $DEPLOY_DIR..."
          if [ ! -f .env ]; then
            echo "ERROR: .env not found in $DEPLOY_DIR. Copy .env.example to .env and set POSTGRES_PASSWORD and JWT_SECRET."
            exit 1
          fi

          echo "==> [4/4] Building and starting Docker Compose stack..."
          docker compose up -d --build --remove-orphans
          docker compose ps
          REMOTE_SCRIPT
          } | ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" \
            -o "StrictHostKeyChecking=${HOST_KEY_OPT}" \
            -o BatchMode=yes \
            "${SSH_USER}@${SSH_HOST}" \
            bash -se -- "$DEPLOY_PATH" "$GH_REPO" "$GH_REF"
