name: Deploy via SSH

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Docker Stack to Server
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            DEPLOY_DIR="${{ vars.DEPLOY_PATH }}"
            if [ -z "$DEPLOY_DIR" ]; then
              DEPLOY_DIR="$HOME/TaskFlow"
            fi
            PLAIN_URL="https://github.com/${{ github.repository }}.git"
            AUTH_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

            echo "==> [1/4] User: $(whoami) | Target dir: $DEPLOY_DIR"
            if [ ! -d "$DEPLOY_DIR/.git" ]; then
              echo "==> [2/4] Cloning repository into $DEPLOY_DIR..."
              mkdir -p "$(dirname "$DEPLOY_DIR")"
              git clone --branch "${{ github.ref_name }}" "$AUTH_URL" "$DEPLOY_DIR"
              cd "$DEPLOY_DIR"
              git remote set-url origin "$PLAIN_URL"
            else
              echo "==> [2/4] Updating existing repository in $DEPLOY_DIR..."
              cd "$DEPLOY_DIR"
              git fetch "$AUTH_URL" "${{ github.ref_name }}"
              git checkout -B "${{ github.ref_name }}" FETCH_HEAD
              git remote set-url origin "$PLAIN_URL"
            fi

            echo "==> [3/4] Checking .env in $DEPLOY_DIR..."
            if [ ! -f .env ]; then
              echo "ERROR: .env not found in $DEPLOY_DIR. Copy .env.example to .env and set POSTGRES_PASSWORD and JWT_SECRET."
              exit 1
            fi

            echo "==> [4/4] Building and starting Docker Compose stack..."
            docker compose up -d --build --remove-orphans
            docker compose ps
