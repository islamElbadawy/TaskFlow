name: CI

on:
  push:
    branches: [main, feature/*, chore/*]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    name: Backend (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore & Build
        run: dotnet build --configuration Release
      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

  frontend:
    name: Frontend (Angular 22.3)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/TaskFlow.Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: src/TaskFlow.Web/package-lock.json
      - name: Install
        # package-lock.json is maintained on Windows; npm ci on Linux can fail on
        # platform-specific optional native deps (@emnapi/*, oxide-linux-x64-gnu).
        # All dependencies in package.json are pinned exact, so npm install is deterministic.
        run: npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test -- --watch=false
      - name: Build
        run: npm run build
