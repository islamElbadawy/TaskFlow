# Local PostgreSQL and a mail catcher for TaskFlow development.
#   cp .env.example .env   (then set POSTGRES_PASSWORD)
#   docker compose up -d
# Host port 5433 on purpose: 5432 is already used by another PostgreSQL on this machine.
name: taskflow

services:
  postgres:
    image: postgres:17
    container_name: taskflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: taskflow
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
    ports:
      - "5433:5432"
    volumes:
      - taskflow-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow -d taskflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Catches every email the API sends (nothing leaves the machine). The API sends to localhost:1025 when
  # Smtp:Enabled is true; read the emails at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.33
    container_name: taskflow-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  taskflow-pgdata:
