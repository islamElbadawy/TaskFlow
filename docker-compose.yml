# TaskFlow local & full-stack Docker Compose setup.
#   cp .env.example .env   (then set POSTGRES_PASSWORD and a 32+ char JWT_SECRET)
#   docker compose up -d --build            # full stack: postgres + mailpit + api + web
#   docker compose up -d postgres mailpit   # hybrid local dev: run api & web on host
# Host port 5433 on purpose: 5432 is already used by another PostgreSQL on this machine.
name: taskflow

services:
  postgres:
    image: postgres:17
    container_name: taskflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: taskflow
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
    ports:
      - "5433:5432"
    volumes:
      - taskflow-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow -d taskflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Catches every email the API sends (nothing leaves the machine). The API sends to localhost:1025
  # (or mailpit:1025 inside Docker) when Smtp:Enabled is true; read the emails at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.33
    container_name: taskflow-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build:
      context: .
      dockerfile: src/TaskFlow.API/Dockerfile
    container_name: taskflow-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      DisableHttpsRedirection: "true"
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=taskflow;Username=taskflow;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
      # Required (32+ chars) when running the api service; defaulted empty so `postgres mailpit` works standalone.
      JwtSettings__Secret: ${JWT_SECRET:-}
      Smtp__Enabled: "true"
      Smtp__Host: mailpit
      Smtp__Port: "1025"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && grep -q \"200 OK\" <&3'"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  web:
    build:
      context: ./src/TaskFlow.Web
      dockerfile: Dockerfile
    container_name: taskflow-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "4200:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  taskflow-pgdata:
